name: Bug 反馈
description: 报告使用 Cloudflare 修复工坊时遇到的问题
title: "[Bug] 简要描述问题"
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！请尽量填写完整，尤其是**诊断日志**，它能大幅加快定位速度。
        提交前请确认内容中不含账号、密码、Cookie 值等敏感信息。

  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 发生了什么？期望的结果是什么？界面上的提示或报错是什么？
      placeholder: 例如：点击「一键修复」后提示清理 Cookie 失败，浏览器未关闭……
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 按顺序描述如何触发该问题
      placeholder: |
        1. 双击 CfValidateFixer.exe
        2. 选择「加载时间过长」模式
        3. 点击「一键修复」
        4. ……
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: 系统版本
      description: Windows 版本与内部版本号（可在「设置 → 系统 → 关于」查看）
      placeholder: 例如 Windows 11 24H2（26100.xxxx）
    validations:
      required: true

  - type: input
    id: app_version
    attributes:
      label: 程序版本
      description: 窗口标题、「关于」窗口或 exe 文件属性中的版本号
      placeholder: 例如 v1.0.0
    validations:
      required: true

  - type: dropdown
    id: safe_mode
    attributes:
      label: 是否使用安全模式
      description: 安全模式（--safe）只诊断、不修改任何系统设置
      options:
        - 否（普通模式）
        - 是（--safe）
    validations:
      required: true

  - type: textarea
    id: diagnostic_log
    attributes:
      label: 诊断日志
      description: 可直接粘贴程序目录下 diagnostic_*.txt 的内容（发送前请删除敏感信息）
      render: text
      placeholder: 将 diagnostic_20261117_105213.txt 的内容粘贴到这里……
    validations:
      required: false

  - type: input
    id: contact
    attributes:
      label: 联系方式（可选）
      description: 邮箱或 QQ，便于进一步沟通
      placeholder: 例如 name@example.com
    validations:
      required: false
